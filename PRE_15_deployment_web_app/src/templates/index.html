<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House Price Estimator</title>

  <!-- Page styles are kept here so the template is easy to demonstrate. -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 20px;
      color: #243447;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 32px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(36, 52, 71, .12);
    }
    h1 { margin-top: 0; color: #1f5f8b; }
    h2 { margin-bottom: 8px; color: #1f5f8b; }
    .field { margin: 16px 0; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1rem;
    }
    .options { margin: 16px 0; }
    .options label { display: inline-block; margin: 6px 14px 0 0; font-weight: normal; }
    input[type="submit"] {
      margin-top: 12px;
      padding: 11px 24px;
      color: #fff;
      background: #1f5f8b;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    input[type="submit"]:hover { background: #17496b; }
    .result {
      margin-top: 28px;
      padding: 16px;
      background: #e8f3fa;
      border-left: 4px solid #1f5f8b;
    }
  </style>
</head>
<body>
  <!-- Main content container -->
  <main class="container">
    <h1>House Price Estimator</h1>
    <p>Enter the details of the house:</p>

    <!-- The form sends the user's inputs to the server with a POST request. -->
    <form method="POST">
      <!-- Numeric features used by the prediction model -->
      <div class="field">
        <label for="bedrooms">Bedrooms</label>
        <input
          id="bedrooms"
          type="text"
          name="bedrooms"
          value="3"
        >
      </div>

      <div class="field">
        <label for="bathrooms">Bathrooms</label>
        <input
          id="bathrooms"
          type="text"
          name="bathrooms"
          value="1"
        >
      </div>

      <div class="field">
        <label for="sqft_living">Living space (sqft)</label>
        <input
          id="sqft_living"
          type="text"
          name="sqft_living"
          value="1180"
        >
      </div>

      <div class="field">
        <label for="sqft_lot">Lot size (sqft)</label>
        <input
          id="sqft_lot"
          type="text"
          name="sqft_lot"
          value="5650"
        >
      </div>

      <div class="field">
        <label for="floors">Floors</label>
        <input
          id="floors"
          type="text"
          name="floors"
          value="1"
        >
      </div>

      <!-- Radio buttons let the user select exactly one waterfront value. -->
      <div class="options">
        <strong>Waterfront:</strong><br>
        <label>
          <input type="radio" name="waterfront" value="Yes" checked>
          Yes
        </label>
        <label>
          <input type="radio" name="waterfront" value="No">
          No
        </label>
      </div>

      <!-- These radio buttons represent the home's condition from 1 to 5. -->
      <div class="options">
        <strong>Condition:</strong><br>
        <label>
          <input type="radio" name="condition" value="1" checked>
          1 - worst
        </label>
        <label>
          <input type="radio" name="condition" value="2">
          2
        </label>
        <label>
          <input type="radio" name="condition" value="3">
          3
        </label>
        <label>
          <input type="radio" name="condition" value="4">
          4
        </label>
        <label>
          <input type="radio" name="condition" value="5">
          5 - best
        </label>
      </div>

      <input type="submit" value="Submit">
    </form>

    <!-- Flask/Jinja inserts the prediction into this paragraph. -->
    <section class="result">
      <h2>Estimated Price</h2>
      <p>{{ prediction }}</p>
    </section>
  </main>
</body>
</html>
